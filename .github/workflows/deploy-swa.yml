name: Deploy Static Web App

on:
  push:
    branches:
      - sandbox
      - main
      - master
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production

permissions:
  contents: read

concurrency:
  group: swa-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'sandbox' && 'sandbox' || 'production') }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'sandbox' && 'sandbox' || 'production') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref_name == 'sandbox' && 'sandbox' || 'production') }}

    defaults:
      run:
        working-directory: GINORI Web App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GINORI Web App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime configuration
        run: npm run generate:config
        env:
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          DATAVERSE_URL: ${{ vars.DATAVERSE_URL }}

      - name: Run tests
        run: npm test

      - name: Deploy Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: GINORI Web App/web
          api_location: ""
          output_location: ""
          skip_app_build: true
