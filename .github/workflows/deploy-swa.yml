name: Validate and deploy Static Web App

on:
  push:
    branches:
      - sandbox
      - main
  pull_request:
    branches:
      - sandbox
      - main

permissions:
  contents: read

concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: GINORI Web App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GINORI Web App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy-sandbox:
    name: Deploy Sandbox
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: sandbox

    defaults:
      run:
        working-directory: GINORI Web App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Sandbox runtime configuration
        run: npm run generate:config
        env:
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          DATAVERSE_URL: ${{ vars.DATAVERSE_URL }}

      - name: Deploy Sandbox Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: GINORI Web App/web
          api_location: ""
          output_location: ""
          skip_app_build: true

  deploy-production:
    name: Deploy Production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    defaults:
      run:
        working-directory: GINORI Web App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Production runtime configuration
        run: npm run generate:config
        env:
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          DATAVERSE_URL: ${{ vars.DATAVERSE_URL }}

      - name: Deploy Production Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: GINORI Web App/web
          api_location: ""
          output_location: ""
          skip_app_build: true
